[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nrp1-silicon-reflex"
version = "1.0.0"
description = "NRP-1: Event-driven Neuromorphic Reflex Processor with on-chip STDP in pure synthesizable Verilog"
authors = [{ name = "ECE Major Project Research Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0"
]
